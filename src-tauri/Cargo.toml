[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.0", features = [] }
tauri-plugin-log = "2"
window-vibrancy = "0.6"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }  # Updated from 0.10.10
tauri-plugin-shell = "2"
ollama-rs = "0.3.2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
urlencoding = "2.1.3"
tauri-plugin-http = "2"
scraper = "0.23.1"
url = "2.5.4"
tauri-plugin-store = "2"
pdf-extract = "0.12.0"
