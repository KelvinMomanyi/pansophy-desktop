name: pansophy

services:
  app:
    build:
      context: .
      args:
        VITE_OLLAMA_API_URL: http://localhost:${PANSOPHY_WEB_PORT:-8080}/ollama
    ports:
      - '${PANSOPHY_WEB_PORT:-8080}:80'
    depends_on:
      model-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.33.2
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  model-setup:
    image: ollama/ollama:0.33.2
    command: ['pull', 'mistral:7b']
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

volumes:
  ollama-data:
